<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <title>CampusHub - Registrazione</title>
</head>

<body>
  <section>
    <h1>Crea un account</h1>
    <p>
        Unisciti alla community di CampusHub per collaborare con altri studenti nel tuo percorso accademico.
    </p>

    <form action="#" method="POST">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" autocomplete="on" required/>

        <label for="cognome">Cognome:</label>
        <input type="text" id="cognome" name="cognome" autocomplete="on" required/>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" autocomplete="on" required/>


        <label for="pwd">Password:</label>
        <input type="password" id="pwd" name="pwd" required/>

        <input type="submit" value="Registrati"/>
    </form>

    <p>Hai già un account? <a href="login.html">Accedi</a></p>
  </section>
</body>
</html>
